# Which model each agent uses, in LiteLLM "provider/model" form.
# The first entry is the primary; the rest are tried in order if it fails.
# Examples: openai/gpt-4o, anthropic/claude-sonnet-4-20250514, gemini/gemini-2.0-flash,
#           azure/<deployment-name> (Microsoft Foundry / Azure OpenAI)

agents:
  query_handler:
    models: [openai/gpt-4o-mini]
  research:
    models: [openai/gpt-4o]
  content_strategist:
    models: [openai/gpt-4o]
  blog_writer:
    models: [openai/gpt-4o]
  linkedin_writer:
    models: [openai/gpt-4o]
  image_generator:
    models: [openai/gpt-4o-mini]   # used for prompt optimisation
  quality_judge:
    models: [openai/gpt-4o-mini]   # the AI reviewer: scores each draft and suggests fixes
  brand_voice:
    models: [openai/gpt-4o-mini]   # Learn voice: describes a brand's voice from a writing sample

image:
  models: [openai/gpt-image-1, openai/dall-e-3]   # tried in order
  sizes:                         # the size each model makes for an aspect, WIDTHxHEIGHT
    openai/gpt-image-1: {landscape: 1536x1024, square: 1024x1024, portrait: 1024x1536}
    openai/dall-e-3: {landscape: 1792x1024, square: 1024x1024, portrait: 1024x1792}
  quality:                       # lower quality keeps image cost down
    openai/gpt-image-1: medium
    openai/dall-e-3: standard
  prices:                        # USD per image, an estimate used only if LiteLLM has no price
    openai/gpt-image-1: 0.042    # medium quality, 1024x1024
    openai/dall-e-3: 0.04        # standard quality, 1024x1024
  # The placeholder card's colour (when no image model works) if the visual style gives none.
  placeholder_colour: "#4A5568"

search:
  providers: [serpapi, tavily]   # tried in order; one without an API key is skipped
  queries_per_run: 4             # search queries per research run
  max_sources: 10                # Sources kept per research run
  pages_to_read: 6               # top Sources whose page text is read
  page_timeout_seconds: 8        # per page read
  text_cap_chars: 2000           # page text kept per Source
  prices: {}                     # USD per search by provider, e.g. {serpapi: 0.015}; default free

llm:
  num_retries: 2
  timeout_seconds: 60
  retry_strategy: exponential_backoff_retry   # or constant_retry: how retries wait before a fallback
  token_prices: {}               # estimate for a model LiteLLM can't price, per 1,000 tokens:
                                 #   openai/some-model: {input_per_1k: 0.0025, output_per_1k: 0.01}

cache:                             # disk caches under <data folder>/<folder>/<cache name>
  folder: cache
  model_responses:                 # identical completions are answered from LiteLLM's cache
    enabled: true
    expiry_hours: 24
  search:                          # search results (#75)
    enabled: true
    expiry_hours: 24
  page_text:                       # fetched page text (#75)
    enabled: true
    expiry_hours: 168
  research_brief:                  # Research Briefs (#76); no expiry, the key changes with the research
    enabled: true
    expiry_hours: null

quality:
  max_revisions: 3
  pass_mark: 7                     # the reviewer's average (1-10) a draft needs to pass
  blog:
    word_range: [900, 1800]        # target word count, when the instructions don't set a length
    density_range: [1.0, 2.0]      # target keyword share of the words, in %
    meta_length_range: [150, 160]  # meta description length, in characters
    max_grade: 10                  # highest Flesch-Kincaid grade level
    min_citations: 3               # fewest distinct Sources cited
  linkedin:
    char_range: [1300, 1600]       # the whole post's length, hashtags included, in characters
    hashtag_range: [8, 12]         # hashtags in the closing hashtag line
    max_hook_chars: 150            # the first line, which shows before "...see more"
    min_paragraphs: 4              # separated by blank lines, not counting the hashtag line
    max_paragraph_chars: 300
    cta_phrases:                   # a closing paragraph with one of these (or a question) is a call to action
      [comment, share, follow, thoughts, let me know, dm, link in, repost, tag someone, join,
       sign up, register]
