# Which model each agent uses, in LiteLLM "provider/model" form.
# The first entry is the primary; the rest are tried in order if it fails.
# Examples: openai/gpt-4o, anthropic/claude-sonnet-4-20250514, gemini/gemini-2.0-flash,
#           azure/<deployment-name> (Microsoft Foundry / Azure OpenAI)

agents:
  query_handler:
    models: [openai/gpt-4o-mini]
  research:
    models: [openai/gpt-4o]
  content_strategist:
    models: [openai/gpt-4o]
  blog_writer:
    models: [openai/gpt-4o]
  linkedin_writer:
    models: [openai/gpt-4o]
  image_generator:
    models: [openai/gpt-4o-mini]   # used for prompt optimisation

image:
  models: [openai/gpt-image-1, openai/dall-e-3]

search:
  providers: [serpapi, tavily]   # tried in order; one without an API key is skipped
  queries_per_run: 4             # search queries per research run
  max_sources: 10                # Sources kept per research run
  pages_to_read: 6               # top Sources whose page text is read
  page_timeout_seconds: 8        # per page read
  text_cap_chars: 2000           # page text kept per Source

llm:
  num_retries: 2
  timeout_seconds: 60

quality:
  max_revisions: 3
  blog:
    word_range: [900, 1800]        # target word count, when the instructions don't set a length
    density_range: [1.0, 2.0]      # target keyword share of the words, in %
    meta_length_range: [150, 160]  # meta description length, in characters
    max_grade: 10                  # highest Flesch-Kincaid grade level
    min_citations: 3               # fewest distinct Sources cited
