[project]
name = "contentblitz"
version = "0.1.0"
description = "Multi-agent content marketing assistant"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=contentblitz --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/contentblitz/web_app/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
